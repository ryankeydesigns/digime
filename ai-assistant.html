  <script>
    (()=>{"use strict";const endpoint="https://ryankey-ai-assistant.29ryankey.workers.dev/chat",copy={zh:{online:"AI 在线",intro:"您好！我是 RyanKey Designs 的 AI 在线助理。有什么可以帮助您？",title:"AI 在线助理",subtitle:"询问网站、品牌、Google Business 与配套",greeting:"您好！我是 RyanKey Designs 的 AI 在线助理。有什么可以帮助您？",label:"输入问题",placeholder:"输入您的问题…",send:"发送",busy:"回复中…",error:"暂时无法取得 AI 回复，请保留问题后再试。",quick:["AI 网站配套多少钱？","企业网站包括什么？","如何联系 Ryan？","Ryan 是谁？","Ryan 在哪里教学？","Ryan 有哪些客户案例？","查看 Google Reviews","Freelancer Community 是什么？","Freelancer Community 成员","Google Business 服务多少钱？","网站制作需要多久？","Ryan 的营业地点在哪里？"],privacy:"AI 回复可能有误，重要资料请向 Ryan 确认。"},en:{online:"AI ONLINE",intro:"Hi! I’m the RyanKey Designs AI assistant. How may I help?",title:"AI Assistant",subtitle:"Ask about websites, branding, Google Business and packages",greeting:"Hi! I’m the RyanKey Designs AI assistant. How may I help?",label:"Enter your question",placeholder:"Type your question…",send:"Send",busy:"Replying…",error:"The AI is temporarily unavailable. Your question is preserved—please retry.",quick:["How much is the AI website package?","What does the corporate package include?","How can I contact Ryan?","Who is Ryan?","Where does Ryan teach?","Which client websites has Ryan built?","Show Google Reviews","What is Freelancer Community?","Freelancer Community members","How much is the Google Business service?","How long does a website take?","Where is Ryan based?"],privacy:"AI may make mistakes; confirm important details with Ryan."}};let language="zh",history=[],busy=false,lastSubmit=0;const q=s=>document.querySelector(s),messages=q("#messages"),input=q("#input"),send=q("#send"),form=q("#form"),quick=q("#quick");function t(){return copy[language]}function localize(){document.documentElement.lang=language==="en"?"en":"zh-Hans";document.querySelectorAll("[data-t]").forEach(el=>{const key=el.dataset.t;if(t()[key])el.textContent=t()[key]});document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t()[el.dataset.ph]);document.qu
