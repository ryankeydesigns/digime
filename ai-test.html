  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111925;--panel2:#182231;--text:#f7f4ed;--muted:#9ba9ba;--gold:#efbd68;--cyan:#68ddeb;--green:#5be49b;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 8% 0,rgba(104,221,235,.13),transparent 28%),radial-gradient(circle at 93% 10%,rgba(239,189,104,.12),transparent 30%),var(--bg)}button,textarea{font:inherit}.page{width:min(100% - 28px,920px);margin:auto;padding:22px 0 28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:-.04em}.brand span{color:var(--gold)}.top-actions{display:flex;align-items:center;gap:8px}.home-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border:1px solid var(--gold);border-radius:999px;background:var(--gold);color:#15191f;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 10px 28px rgba(239,189,104,.2);transition:transform .2s,box-shadow .2s}.home-link:hover,.home-link:focus-visible{transform:translateY(-2px);box-shadow:0 14px 34px rgba(239,189,104,.3);outline:none}.home-link__en{display:none}html[lang^="en"] .home-link__zh{display:none}html[lang^="en"] .home-link__en{display:inline}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.lang{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:#111722}.lang button{border:0;border-radius:999px;padding:7px 10px;background:transparent;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}.lang button[aria-pressed="true"]{background:rgba(239,189,104,.16);color:var(--gold)}.shell{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr);min-height:min(700px,calc(100dvh - 100px));overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(17,25,37,.94);box-shadow:0 30px 100px rgba(0,0,0,.46)}.intro{padding:clamp(24px,5vw,48px);border-right:1px solid var(--line);background:linear-gradient(155deg,rgba(104,221,235,.08),rgba(239,189,104,.05))}.eyebrow{margin:0 0 16px;color:var(--gold);font:800 11px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}.intro h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:.96;letter-spacing:-.055em}.intro h1 span{display:block;color:var(--gold)}.intro p{color:#b8c3cf;line-height:1.65;font-size:14px}.test-note{margin-top:24px;padding:14px;border:1px solid rgba(104,221,235,.22);border-radius:14px;color:var(--muted);font-size:12px;line-height:1.55}.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:0}.chat-head{padding:20px 22px;border-bottom:1px solid var(--line)}.chat-head h2{margin:0;font-size:17px}.chat-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.messages{min-height:250px;overflow:auto;padding:22px;overscroll-behavior:contain}.message{width:fit-content;max-width:84%;margin:0 0 12px;padding:11px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}.message.assistant{margin-right:auto;background:var(--panel2);border-bottom-left-radius:5px}.message.user{margin-left:auto;background:linear-gradient(135deg,#2c626b,#284c58);border-bottom-right-radius:5px}.message.error{color:#ffc0b8;border:1px solid rgba(255,120,105,.25)}.quick{display:flex;flex-wrap:wrap;gap:7px;margin:5px 0 16px}.quick button{border:1px solid rgba(239,189,104,.3);border-radius:999px;padding:7px 10px;background:transparent;color:var(--gold);font-size:12px;cursor:pointer}.composer{padding:14px;border-top:1px solid var(--line);background:#0e151f}.form{display:flex;align-items:flex-end;gap:9px}.input{flex:1;min-height:46px;max-height:120px;res <body>
  <main class="page">

  <script>
    (()=>{"use strict";const endpoint="https://ryankey-ai-assistant.29ryankey.workers.dev/chat",copy={zh:{online:"AI 在线",intro:"这是独立测试页面，不会影响现有 Digime 首页。请测试配套、服务、价格与联系方式等问题。",note:"测试重点：真实回复、中英文切换、连续对话、错误处理，以及电脑和手机显示。",title:"AI 在线助理",subtitle:"询问网站、品牌、Google Business 与配套",greeting:"您好！我是 RyanKey Designs 的 AI 在线助理。有什么可以帮助您？",label:"输入问题",placeholder:"输入您的问题…",send:"发送",busy:"回复中…",error:"暂时无法取得 AI 回复，请保留问题后再试。",quick:["AI 网站配套多少钱？","企业网站包括什么？","如何联系 Ryan？"],privacy:"对话只保留在当前页面；AI 回复可能有误，重要资料请向 Ryan 确认。"},en:{online:"AI ONLINE",intro:"This independent test page does not change the existing Digime homepage. Test questions about packages, services, pricing and contact details.",note:"Test focus: real replies, language switching, conversation context, error handling, and desktop/mobile layout.",title:"AI Assistant",subtitle:"Ask about websites, branding, Google Business and packages",greeting:"Hi! I’m the RyanKey Designs AI assistant. How may I help?",label:"Enter your question",placeholder:"Type your question…",send:"Send",busy:"Replying…",error:"The AI is temporarily unavailable. Your question is preserved—please retry.",quick:["How much is the AI website package?","What does the corporate package include?","How can I contact Ryan?"],privacy:"The conversation stays on this page. AI may make mistakes; confirm important details with Ryan."}};let language="zh",history=[],busy=false,lastSubmit=0;const q=s=>document.querySelector(s),messages=q("#messages"),input=q("#input"),send=q("#send"),form=q("#form"),quick=q("#quick");function t(){return copy[language]}function localize(){document.documentElement.lang=language==="en"?"en":"zh-Hans";document.querySelectorAll("[data-t]").forEach(el=>{const key=el.dataset.t;if(t()[key])el.textContent=t()[key]});document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t()[el.dataset.ph]);document.querySelectorAll("[data-lang]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.lang===language)));quick.innerHTML="";t().quick.forEach(text=>{const button=document.createElement("button");button.type="button";button.textContent=text;button.addEventListener("click",()=>{input.value=text;input.focus()});quick.append(button)})}function add(role,text,error=false){const el=document.createElement("div");el.className=`message ${role}${error?" error":""}`;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}async function submit(){const message=input.value.trim();if(!message||busy||Date.now()-lastSubmit<1200)return;busy=true;lastSubmit=Date.now();send.disabled=true;input.disabled=true;add("user",message);input.value="";const pending=add("assistant",t().busy);try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);const response=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message,language,history:history.slice(-6)}),signal:controller.signal,credentials:"omit",cache:"no-store"});clearTimeout(timer);const data=await response.json().catch(()=>({}));if(!response.ok||typeof data.reply!=="string")throw new Error("request_failed");pending.textContent=data.reply;history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-6)}catch(_){pending.textContent=t().error;pending.classList.add("error");input.value=message}finally{busy=false;send.disabled=false;input.disabled=false;input.focus();messages.scrollTop=messages.scrollHeight}}document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>{language=button.dataset.lang;history=[];localize()}));form.addEventListener("submit",event=>{event.preventDefault();submit()});input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();submit()}});localize()})();
  </script>
